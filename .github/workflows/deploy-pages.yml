name: Deploy FamiliaFinance XP a GitHub Pages

# Publica el contenido de docs/ en la rama gh-pages, que es la fuente
# configurada de GitHub Pages para este repositorio.

on:
  push:
    branches:
      - main
      - claude/friendly-maxwell-mls0q6
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publicar docs/ en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy FamiliaFinance XP: ${{ github.event.head_commit.message }}"
