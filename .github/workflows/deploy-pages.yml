name: Deploy FamiliaFinance XP a GitHub Pages

on:
  push:
    branches:
      - main
      - claude/friendly-maxwell-mls0q6
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Subir artefacto (carpeta docs)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
