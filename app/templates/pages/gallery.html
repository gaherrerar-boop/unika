{% extends "base.html" %}

{% block content %}
<section class="page-header">
  <div class="container">
    <span class="eyebrow">Galería</span>
    <h1 class="page-header__title">Imágenes del taller, del proceso y de las piezas terminadas.</h1>
    <p class="page-header__lede">
      Un vistazo a las manos, los hilos y los detalles que dan vida a cada Unika.
    </p>
  </div>
</section>

<section class="section">
  <div class="container gallery">
    {% for item in items %}
      <figure class="gallery__item">
        <img src="{{ item.src }}" alt="{{ item.alt }}" loading="lazy" />
        <figcaption>{{ item.caption }}</figcaption>
      </figure>
    {% endfor %}
  </div>
</section>
{% endblock %}
